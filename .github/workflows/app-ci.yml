name: app-ci
on:
  push:
    paths: ['app/**', '.github/workflows/app-ci.yml']
  pull_request:
    paths: ['app/**']
jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx expo export --platform android --output-dir /tmp/bundle
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ci.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key-not-real
