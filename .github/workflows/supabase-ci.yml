name: supabase-ci
# Applies every migration to a throwaway local Supabase (Docker on the runner) so a broken
# migration fails CI before it can reach the hosted project.
on:
  push:
    paths: ['supabase/**', '.github/workflows/supabase-ci.yml']
  pull_request:
    paths: ['supabase/**']
jobs:
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase start -x studio,imgproxy,inbucket,edge-runtime,vector,logflare
      - run: supabase db reset
      - run: supabase db lint --level error
